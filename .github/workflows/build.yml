name: build

on:
  push:
  pull_request:

jobs:
  build:
    name: build-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore SystemD.Crystal.slnx

      - name: Build (Release)
        run: dotnet build SystemD.Crystal.slnx -c Release --no-restore

      - name: Test (unit and architecture)
        run: |
          dotnet test tests/SystemD.Crystal.Tests -c Release --no-build --logger "trx;LogFileName=unit.trx" --results-directory ./TestResults
          dotnet test tests/SystemD.Crystal.Architecture.Tests -c Release --no-build --logger "trx;LogFileName=architecture.trx" --results-directory ./TestResults

      # Spec 004 R1.1: nodes in their own processes and hard kills, slower, so a step of their own.
      - name: Test (process)
        run: dotnet test tests/SystemD.Crystal.Process.Tests -c Release --no-build --blame-hang-timeout 5m --logger "trx;LogFileName=process.trx" --results-directory ./TestResults

      - name: Pack
        run: dotnet pack src/SystemD.Crystal/SystemD.Crystal.csproj -c Release --no-build -o ./artifacts

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: ./TestResults/**/*.trx

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.os }}
          path: ./artifacts/*.nupkg
